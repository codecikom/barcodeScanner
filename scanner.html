<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pemindai IMEI - Stok Konter HP</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px; background: #f1f5f9; color: #1e293b;
      font-family: Arial, sans-serif;
    }
    main {
      max-width: 520px; margin: 0 auto; background: #fff; padding: 20px;
      border-radius: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }
    h2 { margin: 0 0 8px; font-size: 20px; }
    p { color: #475569; line-height: 1.5; }
    #reader { width: 100%; margin: 16px 0; }
    button {
      width: 100%; padding: 13px; border: 0; border-radius: 9px;
      color: white; background: #2563eb; font-size: 16px; font-weight: 700;
      margin-top: 10px; cursor: pointer;
    }
    button.secondary { background: #475569; }
    #status {
      padding: 12px; border-radius: 8px; background: #eff6ff;
      color: #1e40af; line-height: 1.5; overflow-wrap: anywhere;
    }
    #result { font-weight: 700; font-size: 18px; overflow-wrap: anywhere; }
  </style>
</head>
<body>
<main>
  <h2>📷 Pemindai IMEI</h2>
  <p>Arahkan kamera ke barcode IMEI 1. Hasil tidak langsung dikirim: periksa angkanya terlebih dahulu, lalu tekan Gunakan IMEI. Barcode selain kandidat 15 digit akan diabaikan.</p>
  <div id="status">Menyiapkan kamera… Jika diminta, pilih <b>Allow / Izinkan</b>.</div>
  <div id="reader"></div>
  <div id="result"></div>
  <button id="useBtn" type="button" onclick="useCandidate()" disabled>Gunakan IMEI ini</button>
  <button class="secondary" id="rescanBtn" type="button" onclick="resumeCamera()" disabled>Scan ulang</button>
  <button id="startBtn" type="button" onclick="startCamera()">Mulai / Buka Kamera</button>
  <button class="secondary" type="button" onclick="closeScanner()">Tutup Pemindai</button>
</main>

<script>
  let scanner = null;
  let busy = false;
  let candidateImei = '';
  const useBtn = document.getElementById('useBtn');
  const rescanBtn = document.getElementById('rescanBtn');

  const statusBox = document.getElementById('status');
  const resultBox = document.getElementById('result');
  const startBtn = document.getElementById('startBtn');

  function setStatus(message) {
    statusBox.textContent = message;
  }

  async function startCamera() {
    if (busy) return;
    busy = true;
    startBtn.disabled = true;
    setStatus('Meminta akses kamera…');

    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error('Browser tidak menyediakan akses kamera. Buka halaman ini melalui HTTPS di Chrome.');
      }

      if (!scanner) {
        scanner = new Html5Qrcode('reader', {
          formatsToSupport: [
            Html5QrcodeSupportedFormats.QR_CODE,
            Html5QrcodeSupportedFormats.CODE_128,
            Html5QrcodeSupportedFormats.CODE_39,
            Html5QrcodeSupportedFormats.EAN_13,
            Html5QrcodeSupportedFormats.EAN_8,
            Html5QrcodeSupportedFormats.UPC_A,
            Html5QrcodeSupportedFormats.UPC_E,
            Html5QrcodeSupportedFormats.ITF,
            Html5QrcodeSupportedFormats.DATA_MATRIX,
            Html5QrcodeSupportedFormats.PDF_417
          ],
          verbose: false
        });
      }

      await scanner.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: { width: 280, height: 150 }, aspectRatio: 1.777 },
        async (decodedText) => {
          const digits = String(decodedText || '').replace(/\D/g, '');
          if (!/^\d{15}$/.test(digits)) {
            setStatus('Barcode terbaca, tetapi bukan kandidat IMEI 15 digit. Arahkan ke barcode IMEI 1.');
            return;
          }
          candidateImei = digits;
          resultBox.textContent = 'Kandidat IMEI: ' + candidateImei;
          setStatus('Periksa angka dan cocokkan dengan tulisan IMEI 1 pada dus. Hasil belum dikirim.');
          try { await scanner.pause(true); } catch (e) {}
          useBtn.disabled = false;
          rescanBtn.disabled = false;
        },
        () => {}
      );
      setStatus('Kamera aktif. Arahkan ke barcode IMEI 1.');
    } catch (err) {
      console.error('Scanner error:', err);
      const detail = (err && err.name ? err.name + ': ' : '') + (err && err.message ? err.message : String(err));
      setStatus('Kamera gagal dibuka — ' + detail + '. Periksa izin kamera untuk situs GitHub Pages ini.');
    } finally {
      busy = false;
      startBtn.disabled = false;
    }
  }


  async function useCandidate() {
    if (!/^\d{15}$/.test(candidateImei)) return;
    if (!window.opener || window.opener.closed) {
      setStatus('Aplikasi asal tidak ditemukan. Buka pemindai dari tombol Scan di aplikasi.');
      return;
    }
    window.opener.postMessage({ type: 'STOK_KONTER_IMEI_SCANNED', imei: candidateImei }, '*');
    setStatus('IMEI dikirim ke aplikasi.');
    try { if (scanner && scanner.isScanning) await scanner.stop(); } catch (e) {}
    setTimeout(() => window.close(), 400);
  }

  async function resumeCamera() {
    candidateImei = '';
    resultBox.textContent = '';
    useBtn.disabled = true;
    rescanBtn.disabled = true;
    try { if (scanner) await scanner.resume(); setStatus('Kamera aktif kembali. Arahkan ke barcode IMEI 1.'); }
    catch (e) { setStatus('Tidak bisa melanjutkan kamera. Tekan Mulai / Buka Kamera.'); }
  }

  async function closeScanner() {
    if (scanner && scanner.isScanning) {
      try { await scanner.stop(); } catch (e) {}
    }
    window.close();
  }

  // Mulai otomatis setelah halaman dibuka; jika browser tidak mengizinkan,
  // pengguna tetap dapat menekan tombol Mulai / Buka Kamera.
  window.addEventListener('load', () => {
    startCamera();
  });
</script>
</body>
</html>
